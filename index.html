<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Belt Dahlia Farm</title>
    
    <!-- Mobile App Settings & Home Screen Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golden Belt">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Maps for React, Lucide Icons, and Firebase -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body class="bg-[#f4f1ea] overscroll-none">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Mic, MicOff, Plus, Minus, Edit2, Trash2, Download, 
          X, AlertCircle, CheckCircle2, Info, Camera, Image as ImageIcon, 
          FileText, HelpCircle, Ban, LeafyGreen, List, Eye, Search, ChevronDown, Repeat, Calendar, MapPin, BarChart3
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, writeBatch } from 'firebase/firestore';

        // ======================================================================
        // YOUR LIVE FIREBASE CONFIG
        // ======================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyCJob-YrKAmXpF0zkdrh4t7R__k9M3CiFw",
          authDomain: "dahlia-farm-pro.firebaseapp.com",
          projectId: "dahlia-farm-pro",
          storageBucket: "dahlia-farm-pro.firebasestorage.app",
          messagingSenderId: "350375032767",
          appId: "1:350375032767:web:ca63c5cf7e0a64d616530a"
        };
        // ======================================================================

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // Haptic Feedback Engine
        const triggerHaptic = (type = 'success') => {
            if (!navigator.vibrate) return;
            if (type === 'success') navigator.vibrate(50); 
            else if (type === 'warning') navigator.vibrate([30, 50, 30]); 
            else if (type === 'delete') navigator.vibrate([50, 100, 50]); 
        };

        function App() {
            const [user, setUser] = useState(null);
            const [plants, setPlants] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            const [selectedYear, setSelectedYear] = useState(new Date().getFullYear().toString());
            const availableYears = ["2025", "2026", "2027", "2028"];

            const [currentRow, setCurrentRow] = useState(1);
            const [currentPosition, setCurrentPosition] = useState(1);
            const [viewMode, setViewMode] = useState('current');
            const [searchQuery, setSearchQuery] = useState('');

            const [isListening, setIsListening] = useState(false);
            const [feedback, setFeedback] = useState({ message: '', type: '' });
            const [speechSupported, setSpeechSupported] = useState(true);
            const [editingPlant, setEditingPlant] = useState(null);
            
            // Modal States
            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [showCommandsHelp, setShowCommandsHelp] = useState(false);
            const [viewingPhoto, setViewingPhoto] = useState(null);
            const [plantToDelete, setPlantToDelete] = useState(null);
            const [duplicateWarning, setDuplicateWarning] = useState(null); 
            
            // Tally Modal States
            const [showStatsModal, setShowStatsModal] = useState(false);
            const [tallySearch, setTallySearch] = useState('');
            
            // Tracking Context
            const [lastEnteredVariety, setLastEnteredVariety] = useState(null);
            const [isCompressing, setIsCompressing] = useState(false);
            
            const recognitionRef = useRef(null);
            const listEndRef = useRef(null);
            const initialLoadDoneRef = useRef(false);

            useEffect(() => {
                const timer = setTimeout(() => setIsLoading(false), 4000);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (viewMode === 'current' && listEndRef.current && !searchQuery) {
                    listEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [plants, currentPosition, viewMode, searchQuery]);

            // Auth
            useEffect(() => {
                if (!auth) { setIsLoading(false); return; }
                signInAnonymously(auth).catch((error) => { console.error("Auth error:", error); setIsLoading(false); });
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser); if (!currentUser) setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync based on Year
            useEffect(() => {
                if (!user || !db) return;
                initialLoadDoneRef.current = false; 
                
                const collectionName = `plants_${selectedYear}`;
                const plantsRef = collection(db, collectionName);
                
                const unsubscribe = onSnapshot(plantsRef, (snapshot) => {
                    const loadedPlants = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPlants(loadedPlants);
                    
                    if (!initialLoadDoneRef.current) {
                        if (loadedPlants.length > 0) {
                            const maxRow = Math.max(...loadedPlants.map(p => p.row));
                            const plantsInMaxRow = loadedPlants.filter(p => p.row === maxRow);
                            const maxPos = plantsInMaxRow.length > 0 ? Math.max(...plantsInMaxRow.map(p => p.position)) : 0;
                            setCurrentRow(maxRow);
                            setCurrentPosition(maxPos + 1);
                            
                            const lastPlant = plantsInMaxRow.find(p => p.position === maxPos);
                            if (lastPlant) setLastEnteredVariety(lastPlant.variety);
                        } else {
                            setCurrentRow(1); setCurrentPosition(1);
                        }
                        initialLoadDoneRef.current = true;
                    }
                    setIsLoading(false);
                }, (error) => {
                    setFeedback({ message: 'Offline mode active. Data saving locally.', type: 'info' });
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user, selectedYear]);

            // Tally Calculations (With Row Tracking)
            const totalPlanted = useMemo(() => {
                return plants.filter(p => p.status !== 'skipped' && p.variety.toLowerCase() !== 'empty space').length;
            }, [plants]);

            const varietyTallies = useMemo(() => {
                const data = {};
                plants.forEach(p => {
                    if (p.status !== 'skipped' && p.variety.toLowerCase() !== 'empty space') {
                        if (!data[p.variety]) data[p.variety] = { count: 0, rows: new Set() };
                        data[p.variety].count += 1;
                        data[p.variety].rows.add(p.row);
                    }
                });
                return Object.entries(data).sort((a, b) => b[1].count - a[1].count);
            }, [plants]);

            const filteredTallies = useMemo(() => {
                if (!tallySearch) return varietyTallies;
                return varietyTallies.filter(([variety]) => variety.toLowerCase().includes(tallySearch.toLowerCase()));
            }, [varietyTallies, tallySearch]);

            // SMART DICTIONARY
            const getLevenshteinDistance = (a, b) => {
                const matrix = [];
                for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
                for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
                for (let i = 1; i <= b.length; i++) {
                    for (let j = 1; j <= a.length; j++) {
                        if (b.charAt(i - 1) === a.charAt(j - 1)) {
                            matrix[i][j] = matrix[i - 1][j - 1];
                        } else {
                            matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                        }
                    }
                }
                return matrix[b.length][a.length];
            };

            const autocorrectVariety = (inputVariety) => {
                const uniqueVarieties = [...new Set(plants.map(p => p.variety))];
                for (let existing of uniqueVarieties) {
                    if (existing.toLowerCase() === inputVariety.toLowerCase()) return existing;
                    const distance = getLevenshteinDistance(inputVariety.toLowerCase(), existing.toLowerCase());
                    if (distance <= 2 && existing.length > 4) return existing;
                }
                return inputVariety;
            };

            const formatTitleCase = (text) => {
                return text.replace(/\b\w/g, (char, index, str) => {
                    if (index > 0 && str[index - 1] === "'") return char.toLowerCase();
                    return char.toUpperCase();
                });
            };

            // Speech Rec
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) { setSpeechSupported(false); return; }

                const recognition = new SpeechRecognition();
                recognition.continuous = false; 
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const lastResultIndex = event.results.length - 1;
                    const transcript = event.results[lastResultIndex][0].transcript.trim();
                    processTranscript(transcript);
                };

                recognition.onerror = (event) => {
                    if (event.error !== 'no-speech') {
                        showFeedback(`Microphone error: ${event.error}`, 'error'); forceStopMic();
                    }
                };

                recognition.onend = () => setIsListening(false);
                recognitionRef.current = recognition;

                return () => { if (recognitionRef.current) recognitionRef.current.stop(); };
            }, [currentRow, currentPosition, plants, lastEnteredVariety]);

            const forceStopMic = () => {
                if (recognitionRef.current) recognitionRef.current.stop();
                setIsListening(false);
            };

            const showFeedback = (message, type) => {
                setFeedback({ message, type });
                setTimeout(() => setFeedback({ message: '', type: '' }), 3000);
            };

            const toggleListening = () => {
                if (!speechSupported) { showFeedback('Voice not supported on this browser.', 'error'); return; }
                if (isListening) {
                    forceStopMic(); showFeedback('Voice tracking paused.', 'info');
                } else {
                    try { recognitionRef.current.start(); setIsListening(true); } 
                    catch (e) { console.error(e); }
                }
            };

            const handleRowChange = (newRow) => {
                if (newRow < 1) return;
                setCurrentRow(newRow);
                const plantsInRow = plants.filter(p => p.row === newRow);
                const maxPos = plantsInRow.length > 0 ? Math.max(...plantsInRow.map(p => p.position)) : 0;
                setCurrentPosition(maxPos + 1);
            };

            const processTranscript = (rawText) => {
                const wordToNum = { 'one':1,'two':2,'to':2,'too':2,'three':3,'four':4,'for':4,'five':5,'six':6,'seven':7,'eight':8,'nine':9,'ten':10 };
                const lowerText = rawText.toLowerCase().trim();
                const normalizedText = lowerText.split(' ').map(w => wordToNum[w] !== undefined ? wordToNum[w] : w).join(' ');

                if (normalizedText.includes('next row') || normalizedText.includes('advance row')) {
                    handleRowChange(currentRow + 1); showFeedback(`Moved to Row ${currentRow + 1}`, 'info'); triggerHaptic(); return forceStopMic();
                }

                const rowMatch = normalizedText.match(/(?:go to|jump to|move to|change to|set)?\s*row\s*(\d+)/);
                if (rowMatch) {
                    const r = parseInt(rowMatch[1], 10); handleRowChange(r); showFeedback(`Moved to Row ${r}`, 'info'); triggerHaptic(); return forceStopMic();
                }

                const posMatch = normalizedText.match(/(?:go to|jump to|move to|change to|set)?\s*(?:plant|position|number|num)\s*(\d+)/);
                if (posMatch) {
                    const p = parseInt(posMatch[1], 10); setCurrentPosition(p); showFeedback(`Jumped to Plant ${p}`, 'info'); triggerHaptic(); return forceStopMic();
                }

                if (normalizedText.match(/^(skip space|empty space|leave empty|mark empty)$/)) {
                    attemptSavePlant({ row: currentRow, position: currentPosition, variety: 'Empty Space', status: 'skipped' });
                    return forceStopMic();
                }

                if (normalizedText.match(/^(did not grow|didn't grow|failed|dead|mark failed)$/)) {
                    const existing = plants.find(p => p.row === currentRow && p.position === currentPosition);
                    if (existing) attemptSavePlant({ ...existing, status: 'failed' });
                    else showFeedback(`No plant at Position ${currentPosition} to fail.`, 'error');
                    return forceStopMic();
                }

                let variety = rawText.replace(/^(is|called|variety)\s+/i, '').trim();

                const spellMatch = variety.match(/\bspell(?:ed)?\s+(.+)$/i);
                
                if (spellMatch) {
                    const spelledTokens = spellMatch[1].toLowerCase().split(/\s+/);
                    let spelledVariety = '';
                    
                    spelledTokens.forEach(token => {
                        if (token === 'space') spelledVariety += ' ';
                        else if (token === 'apostrophe') spelledVariety += "'";
                        else if (token === 'hyphen' || token === 'dash') spelledVariety += "-";
                        else if (token.length === 1) spelledVariety += token; 
                        else spelledVariety += token; 
                    });
                    
                    variety = formatTitleCase(spelledVariety).trim();
                } else {
                    variety = formatTitleCase(variety);
                    variety = autocorrectVariety(variety);
                }

                if (variety) {
                    attemptSavePlant({ row: currentRow, position: currentPosition, variety, status: 'active' });
                    forceStopMic(); 
                } else {
                    showFeedback(`Didn't catch the variety name.`, 'error'); forceStopMic();
                }
            };

            const attemptSavePlant = (plantData, bypassDuplicateCheck = false) => {
                const isNewPlant = !plantData.id;
                
                if (isNewPlant && !bypassDuplicateCheck && plantData.status === 'active' && plantData.variety !== 'Empty Space') {
                    const existsInDb = plants.filter(p => p.variety === plantData.variety && p.status === 'active');
                    if (existsInDb.length > 0 && lastEnteredVariety !== plantData.variety) {
                        const existingRows = [...new Set(existsInDb.map(p => p.row))].join(', ');
                        setDuplicateWarning({ ...plantData, existingCount: existsInDb.length, existingRows: existingRows });
                        triggerHaptic('warning');
                        return;
                    }
                }
                executeSaveToCloud(plantData);
            };

            const executeSaveToCloud = async (plantData) => {
                if (!user || !db) return;
                
                const isNewPlant = !plantData.id;
                const idToUse = plantData.id || Date.now().toString();
                const dataToSave = { ...plantData, id: idToUse, status: plantData.status || 'active' };
                const collectionName = `plants_${selectedYear}`;
                
                const batch = writeBatch(db);
                let currentPlantsState = [...plants];

                if (isNewPlant || editingPlant?.position !== plantData.position) {
                    const slotOccupied = plants.some(p => p.row === plantData.row && p.position === plantData.position && p.id !== idToUse);
                    if (slotOccupied) {
                        const plantsToShift = currentPlantsState.filter(p => p.row === plantData.row && p.position >= plantData.position && p.id !== idToUse);
                        plantsToShift.forEach(p => {
                            const ref = doc(db, collectionName, p.id);
                            batch.update(ref, { position: p.position + 1 });
                        });
                        showFeedback(`Inserted. Row shifted up!`, 'info');
                    }
                }

                const newDocRef = doc(db, collectionName, idToUse);
                batch.set(newDocRef, dataToSave);
                
                try {
                    await batch.commit();
                    
                    if (isNewPlant || (editingPlant && editingPlant.row === currentRow && editingPlant.position === currentPosition)) {
                        setCurrentPosition(plantData.position + 1);
                        if (plantData.status === 'active' && plantData.variety !== 'Empty Space') {
                            setLastEnteredVariety(plantData.variety);
                            showFeedback(`Saved: ${plantData.variety}`, 'success');
                            triggerHaptic('success');
                        }
                    }
                } catch (err) {
                    console.error("Save failed:", err); showFeedback("Error saving to database.", "error");
                }
                
                setIsManualModalOpen(false); setDuplicateWarning(null); setEditingPlant(null);
            };

            const confirmDeletePlant = async () => {
                if (!plantToDelete || !user || !db) return;
                
                const { id, row, position } = plantToDelete;
                const collectionName = `plants_${selectedYear}`;
                const batch = writeBatch(db);
                let currentPlantsState = plants.filter(p => p.id !== id);

                const plantsToShift = currentPlantsState.filter(p => p.row === row && p.position > position);
                plantsToShift.forEach(p => {
                    const ref = doc(db, collectionName, p.id);
                    batch.update(ref, { position: p.position - 1 });
                });

                const targetRef = doc(db, collectionName, id);
                batch.delete(targetRef);

                try {
                    await batch.commit();
                    showFeedback('Plant deleted. Row shifted down.', 'success');
                    triggerHaptic('delete');
                    setPlantToDelete(null);
                    
                    const remainingInRow = currentPlantsState.filter(p => p.row === row);
                    const newMaxPos = remainingInRow.length > 0 ? Math.max(...remainingInRow.map(p => p.position)) : 0;
                    
                    if (currentRow === row && currentPosition > newMaxPos + 1) setCurrentPosition(newMaxPos + 1);
                } catch (err) { console.error("Delete failed:", err); }
            };

            const duplicateLastPlant = () => {
                const previousPlant = plants.find(p => p.row === currentRow && p.position === currentPosition - 1);
                if (previousPlant) attemptSavePlant({ row: currentRow, position: currentPosition, variety: previousPlant.variety, status: 'active' }, true);
            };

            const handlePhotoCapture = async (e, plant) => {
                const file = e.target.files[0];
                if (!file) return;
                setIsCompressing(true); showFeedback('Optimizing photo...', 'info');
                try {
                    const compressedDataUrl = await compressImage(file);
                    executeSaveToCloud({ ...plant, photo: compressedDataUrl });
                    showFeedback('Photo attached successfully!', 'success'); triggerHaptic();
                } catch (err) { showFeedback('Failed to process photo.', 'error'); } 
                finally { setIsCompressing(false); e.target.value = ''; }
            };

            const compressImage = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const scaleSize = 800 / img.width;
                            canvas.width = 800; canvas.height = img.height * scaleSize;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.6));
                        };
                        img.onerror = reject; img.src = event.target.result;
                    };
                    reader.onerror = reject; reader.readAsDataURL(file);
                });
            };

            const exportToCSV = () => {
                if (plants.length === 0) return alert("No data to export!");
                const sortedPlants = [...plants].sort((a, b) => a.row !== b.row ? a.row - b.row : a.position - b.position);
                const headers = ['Row', 'Position', 'Variety', 'Status', 'Notes', 'Has Photo', 'Date Logged'];
                const rows = sortedPlants.map(p => [
                    p.row, p.position, `"${p.variety || ''}"`, p.status || 'active', `"${(p.notes || '').replace(/"/g, '""')}"`, p.photo ? 'Yes' : 'No', new Date(parseInt(p.id)).toLocaleDateString()
                ]);
                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `golden_belt_${selectedYear}.csv`);
                document.body.appendChild(link); link.click(); document.body.removeChild(link);
            };

            const filteredPlants = useMemo(() => {
                if (!searchQuery) return plants;
                const lowerQuery = searchQuery.toLowerCase();
                return plants.filter(p => p.variety.toLowerCase().includes(lowerQuery) || (p.notes && p.notes.toLowerCase().includes(lowerQuery)));
            }, [plants, searchQuery]);

            const groupedPlants = useMemo(() => {
                const groups = filteredPlants.reduce((acc, plant) => {
                    if (!acc[plant.row]) acc[plant.row] = [];
                    acc[plant.row].push(plant); return acc;
                }, {});
                Object.keys(groups).forEach(row => groups[row].sort((a, b) => a.position - b.position));
                return groups;
            }, [filteredPlants]);

            const availableRows = useMemo(() => [...new Set(plants.map(p => p.row))].sort((a, b) => a - b), [plants]);
            const rowsToRender = searchQuery ? Object.keys(groupedPlants).sort((a,b) => Number(a) - Number(b)) : (viewMode === 'current' ? (groupedPlants[currentRow] ? [currentRow.toString()] : []) : Object.keys(groupedPlants).sort((a,b) => Number(a) - Number(b)));
            
            // For Duplicate Button
            const previousPlant = plants.find(p => p.row === currentRow && p.position === currentPosition - 1);
            const previousPlantTotal = previousPlant ? plants.filter(p => p.variety === previousPlant.variety && p.status === 'active').length : 0;

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-[#f4f1ea] flex items-center justify-center font-sans text-emerald-900">
                        <div className="animate-pulse flex flex-col items-center">
                            <img src="icon.png" alt="Golden Belt Logo" className="w-20 h-20 mb-4 drop-shadow-lg rounded-full" onError={(e) => { e.target.style.display = 'none'; }} />
                            <p className="font-medium tracking-wide mt-2">Connecting to {selectedYear} Database...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#f4f1ea] font-sans text-slate-800 flex flex-col overflow-hidden">
                    
                    {/* NOTIFICATION TOAST - MOVED TO TOP */}
                    <div className="fixed top-20 left-0 right-0 flex justify-center pointer-events-none z-[100] px-4">
                        {feedback.message && (
                            <div className={`flex items-center gap-2 px-4 py-2.5 rounded-2xl text-sm font-bold shadow-2xl animate-in fade-in slide-in-from-top-4 ${
                                feedback.type === 'success' ? 'bg-emerald-600 text-white' :
                                feedback.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'
                            }`}>
                                {feedback.type === 'success' && <CheckCircle2 className="w-5 h-5 shrink-0" />}
                                {feedback.type === 'error' && <AlertCircle className="w-5 h-5 shrink-0" />}
                                {feedback.type === 'info' && <Info className="w-5 h-5 shrink-0" />}
                                {feedback.message}
                            </div>
                        )}
                    </div>

                    <header className="bg-emerald-900 text-white p-3 shadow-md z-20 shrink-0">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2.5">
                                <img src="icon.png" alt="Logo" className="w-9 h-9 rounded-full border border-emerald-700 shadow-sm object-cover bg-white" onError={(e) => { e.target.style.display = 'none'; }} />
                                <div>
                                    <h1 className="text-lg font-bold tracking-wide leading-tight text-emerald-50">Golden Belt</h1>
                                    <div className="flex items-center gap-1">
                                        <p className="text-[10px] text-emerald-200 font-semibold tracking-widest uppercase leading-none">Dahlia Farm</p>
                                        <button 
                                            onClick={() => setShowStatsModal(true)}
                                            className="text-[10px] text-amber-400 font-bold tracking-widest uppercase leading-none bg-emerald-800/80 px-1.5 py-0.5 rounded-full ml-1 hover:bg-emerald-700 transition active:scale-95"
                                            title="View Harvest Tally"
                                        >
                                            • {totalPlanted} PLANTED
                                        </button>
                                    </div>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                <div className="relative">
                                    <select 
                                        value={selectedYear} 
                                        onChange={(e) => setSelectedYear(e.target.value)}
                                        className="appearance-none bg-emerald-800 text-emerald-50 font-bold text-xs py-1.5 pl-2 pr-6 rounded-lg border border-emerald-700 focus:outline-none focus:ring-1 focus:ring-amber-400"
                                    >
                                        {availableYears.map(year => <option key={year} value={year}>{year}</option>)}
                                    </select>
                                    <Calendar className="absolute right-1.5 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-emerald-300 pointer-events-none" />
                                </div>

                                <button onClick={() => { setViewMode(viewMode === 'current' ? 'all' : 'current'); setSearchQuery(''); }} className="flex items-center gap-1 bg-emerald-800 hover:bg-emerald-700 px-2 py-1.5 rounded-lg text-xs transition-colors border border-emerald-700">
                                    {viewMode === 'current' ? <List className="w-4 h-4 text-emerald-300" /> : <Eye className="w-4 h-4 text-emerald-300" />}
                                    <span className="hidden sm:inline">{viewMode === 'current' ? 'View All' : 'Focus Row'}</span>
                                </button>
                                <button onClick={exportToCSV} className="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-amber-950 font-semibold px-2 py-1.5 rounded-lg text-xs transition-colors shadow-sm">
                                    <Download className="w-4 h-4" />
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-emerald-100 shadow-sm shrink-0 z-10 sticky top-0">
                        <div className="max-w-4xl mx-auto p-2 flex gap-2">
                            <div className="relative flex-1">
                                <Search className="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                <input 
                                    type="text" placeholder="Search variety..." value={searchQuery} onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-colors"
                                />
                                {searchQuery && <button onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600"><X className="w-3.5 h-3.5" /></button>}
                            </div>

                            <div className="relative w-36">
                                <select 
                                    value={viewMode === 'current' && !searchQuery ? currentRow : ''}
                                    onChange={(e) => {
                                        const r = parseInt(e.target.value, 10);
                                        if(r) { handleRowChange(r); setViewMode('current'); setSearchQuery(''); }
                                    }}
                                    className="w-full appearance-none bg-emerald-50 border border-emerald-200 text-emerald-800 font-medium text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                                >
                                    <option value="" disabled>Jump Row...</option>
                                    {availableRows.map(r => <option key={r} value={r}>Row {r}</option>)}
                                </select>
                                <ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-600 pointer-events-none" />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-y-auto w-full max-w-4xl mx-auto p-4 pb-48">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => setShowCommandsHelp(!showCommandsHelp)} className="text-emerald-700 text-sm font-medium flex items-center gap-1 bg-emerald-100 px-3 py-1.5 rounded-full hover:bg-emerald-200 transition-colors">
                                <HelpCircle className="w-4 h-4" /> Voice Commands
                            </button>
                            <button onClick={() => { setEditingPlant(null); setIsManualModalOpen(true); }} className="text-sm flex items-center gap-1 bg-slate-800 text-white px-3 py-1.5 rounded-full shadow-sm hover:bg-slate-700 transition">
                                <Plus className="w-4 h-4" /> Insert/Edit
                            </button>
                        </div>

                        {showCommandsHelp && (
                            <div className="bg-emerald-50 rounded-xl p-4 mb-6 border border-emerald-100 text-sm animate-in fade-in slide-in-from-top-2">
                                <h3 className="font-bold text-emerald-900 mb-2 border-b border-emerald-200 pb-1">Smart Voice Features:</h3>
                                <ul className="space-y-1.5 text-emerald-800">
                                    <li><strong className="text-emerald-900">Custom Spelling:</strong> Say "Spell" then the letters! (e.g. <i>"Genie's incredible spell j e a n n i e apostrophe s space i n c r e d i b a l l"</i>)</li>
                                    <li><strong className="text-emerald-900">Shift Logic:</strong> Manually inserting a plant in a filled position pushes the rest of the row up. Deleting shifts them down.</li>
                                    <li><strong className="text-emerald-900">"Next row"</strong> - Moves tracker to the next row</li>
                                    <li><strong className="text-emerald-900">"Empty Space"</strong> / <strong className="text-emerald-900">"Did not grow"</strong></li>
                                </ul>
                            </div>
                        )}

                        <section className="space-y-6">
                            {rowsToRender.length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-emerald-200 text-emerald-600/60 mt-4">
                                    <LeafyGreen className="w-12 h-12 mx-auto mb-3 opacity-50 text-emerald-700" />
                                    <p className="font-medium text-emerald-800">{searchQuery ? 'No plants found.' : `Row ${currentRow} is empty.`}</p>
                                </div>
                            ) : (
                                rowsToRender.map(rowNum => (
                                    <div key={rowNum} className="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)] border border-emerald-100 overflow-hidden">
                                        <div className="bg-emerald-50/80 px-4 py-3 border-b border-emerald-100 flex justify-between items-center sticky top-0 z-10 shadow-sm backdrop-blur-sm">
                                            <h3 className="font-bold text-emerald-900 text-lg flex items-center gap-2">Row {rowNum}</h3>
                                            <span className="text-xs font-semibold bg-white text-emerald-700 px-2 py-1 rounded-full shadow-sm border border-emerald-100">{groupedPlants[rowNum].length} entries</span>
                                        </div>
                                        
                                        <div className="divide-y divide-slate-100">
                                            {groupedPlants[rowNum].map(plant => {
                                                const isSkipped = plant.status === 'skipped';
                                                const isFailed = plant.status === 'failed';
                                                const isJustAdded = !searchQuery && Number(rowNum) === currentRow && plant.position === currentPosition - 1;
                                                
                                                return (
                                                    <div key={plant.id} className={`p-4 flex flex-col sm:flex-row sm:items-center justify-between transition-colors gap-4 
                                                        ${isSkipped ? 'bg-slate-50 opacity-70 border-l-4 border-slate-300' : 
                                                        isFailed ? 'bg-red-50/50 hover:bg-red-50 border-l-4 border-red-300' : 
                                                        isJustAdded ? 'bg-emerald-50/50 border-l-4 border-amber-400' :
                                                        'hover:bg-slate-50 border-l-4 border-transparent'}
                                                    `}>
                                                        <div className="flex items-start sm:items-center gap-4 flex-1">
                                                            <div className={`w-14 h-10 rounded-xl flex flex-col items-center justify-center font-bold shrink-0 mt-1 sm:mt-0 shadow-sm border
                                                                ${isSkipped ? 'bg-slate-200 text-slate-500 border-slate-300' :
                                                                isFailed ? 'bg-red-100 text-red-700 border-red-200' :
                                                                'bg-gradient-to-br from-amber-300 to-amber-500 text-amber-950 border-amber-400'}`}
                                                            >
                                                                <span className="text-[9px] uppercase tracking-widest opacity-80 -mb-1 font-bold">POS</span>
                                                                <span className="text-base">{plant.position}</span>
                                                            </div>
                                                            
                                                            <div className="flex-1">
                                                                <div className="flex items-center gap-2">
                                                                    {isSkipped ? <Ban className="w-4 h-4 text-slate-400" /> : 
                                                                    isFailed ? <AlertCircle className="w-4 h-4 text-red-500" /> : 
                                                                    <LeafyGreen className="w-4 h-4 text-emerald-500" />}
                                                                    
                                                                    <p className={`font-semibold text-lg ${isSkipped ? 'text-slate-500 italic' : isFailed ? 'text-red-900 line-through' : 'text-slate-800'}`}>
                                                                        {plant.variety}
                                                                    </p>
                                                                    
                                                                    {plant.photo && (
                                                                        <button onClick={() => setViewingPhoto(plant.photo)} className="text-emerald-600 hover:text-emerald-700 bg-emerald-50 p-1 rounded-md transition-colors" title="View Photo">
                                                                            <ImageIcon className="w-4 h-4" />
                                                                        </button>
                                                                    )}
                                                                </div>
                                                                {isFailed && <p className="text-xs text-red-600 font-medium mt-0.5">Did not grow</p>}
                                                                {plant.notes && (
                                                                    <div className="flex items-start gap-1.5 mt-1.5 text-sm text-slate-600 bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
                                                                        <FileText className="w-4 h-4 mt-0.5 shrink-0 text-slate-400" />
                                                                        <p className="leading-snug">{plant.notes}</p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-1 self-end sm:self-auto shrink-0 bg-white sm:bg-transparent p-1 sm:p-0 rounded-lg shadow-sm sm:shadow-none border border-slate-100 sm:border-none">
                                                            <div className={`relative flex items-center gap-1 p-2 rounded-lg transition overflow-hidden cursor-pointer ${isSkipped ? 'opacity-50 cursor-not-allowed' : 'text-emerald-600 hover:bg-emerald-50'}`}>
                                                                <Camera className="w-5 h-5 relative z-10" />
                                                                <input type="file" accept="image/*" capture="environment" className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" disabled={isSkipped} onChange={(e) => handlePhotoCapture(e, plant)} />
                                                            </div>
                                                            <div className="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></div>
                                                            <button onClick={() => { setEditingPlant(plant); setIsManualModalOpen(true); }} className="p-2 text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"><Edit2 className="w-5 h-5" /></button>
                                                            <button onClick={() => setPlantToDelete(plant)} className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition"><Trash2 className="w-5 h-5" /></button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={listEndRef} className="h-4"></div>
                        </section>
                    </main>

                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-40 pb-6 pt-3 px-4 sm:pb-4">
                        
                        {/* DUPLICATE LAST BUTTON - NOW WITH LIVE COUNTER */}
                        {previousPlant && previousPlant.variety !== 'Empty Space' && (
                            <div className="absolute left-0 right-0 -top-[70px] flex justify-center">
                                <button 
                                    onClick={duplicateLastPlant}
                                    className="flex items-center gap-2 bg-amber-400 hover:bg-amber-500 text-amber-950 px-5 py-2 rounded-full shadow-md transition-transform active:scale-95 border border-amber-500"
                                >
                                    <Repeat className="w-5 h-5" />
                                    <div className="flex flex-col items-start text-left leading-tight">
                                        <span className="font-black text-sm">Duplicate +1</span>
                                        <span className="text-[10px] uppercase tracking-wider font-bold opacity-80">Total so far: {previousPlantTotal}</span>
                                    </div>
                                </button>
                            </div>
                        )}

                        <div className="max-w-md mx-auto relative flex justify-between items-center h-16">
                            <div className="flex flex-col items-center w-24">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Row</span>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => handleRowChange(currentRow - 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Minus className="w-5 h-5"/></button>
                                    <span className="text-2xl font-black text-slate-800 w-8 text-center">{currentRow}</span>
                                    <button onClick={() => handleRowChange(currentRow + 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Plus className="w-5 h-5"/></button>
                                </div>
                            </div>

                            <div className="absolute left-1/2 -translate-x-1/2 -top-8 flex flex-col items-center">
                                <button
                                    onClick={toggleListening}
                                    disabled={!speechSupported || isCompressing}
                                    className={`flex items-center justify-center w-20 h-20 rounded-full shadow-2xl border-[6px] border-white transition-all duration-300 ${
                                        isListening 
                                        ? 'bg-red-500 text-white animate-pulse scale-105 shadow-[0_0_20px_rgba(239,68,68,0.4)]' 
                                        : 'bg-emerald-700 text-white hover:bg-emerald-600 hover:scale-105'
                                    } ${(!speechSupported || isCompressing) && 'opacity-50 cursor-not-allowed'}`}
                                >
                                    {isListening ? <Mic className="w-8 h-8" /> : <MicOff className="w-8 h-8" />}
                                </button>
                                <div className="text-center mt-1 text-[10px] font-bold tracking-wider uppercase text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded-full border border-emerald-100">
                                    Tap to Log
                                </div>
                            </div>

                            <div className="flex flex-col items-center w-24">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Position</span>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setCurrentPosition(Math.max(1, currentPosition - 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Minus className="w-5 h-5"/></button>
                                    <span className="text-2xl font-black text-slate-800 w-8 text-center">{currentPosition}</span>
                                    <button onClick={() => setCurrentPosition(currentPosition + 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Plus className="w-5 h-5"/></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {/* MODALS */}
                    
                    {/* ADVANCED HARVEST TALLY MODAL */}
                    {showStatsModal && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden animate-in zoom-in-95 flex flex-col max-h-[85vh]">
                                <div className="flex justify-between items-center p-4 border-b bg-emerald-50 shrink-0">
                                    <div className="flex items-center gap-2 text-emerald-900">
                                        <BarChart3 className="w-5 h-5" />
                                        <h3 className="font-bold text-lg">{selectedYear} Harvest Tally</h3>
                                    </div>
                                    <button onClick={() => {setShowStatsModal(false); setTallySearch('');}} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                                </div>
                                <div className="p-4 bg-emerald-800 text-white text-center shrink-0">
                                    <span className="text-4xl font-black">{totalPlanted}</span>
                                    <p className="text-xs text-emerald-200 font-bold tracking-widest uppercase">Total Tubers Planted</p>
                                </div>
                                
                                <div className="p-3 bg-slate-50 border-b border-slate-100 shrink-0">
                                    <div className="relative">
                                        <Search className="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                        <input 
                                            type="text" placeholder="Find variety..." 
                                            value={tallySearch} onChange={(e) => setTallySearch(e.target.value)}
                                            className="w-full pl-8 pr-3 py-2 bg-white border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                                        />
                                    </div>
                                </div>

                                <div className="overflow-y-auto p-0 flex-1">
                                    {filteredTallies.length === 0 ? (
                                        <p className="text-center text-slate-500 italic py-8">No varieties found.</p>
                                    ) : (
                                        <ul className="divide-y divide-slate-100">
                                            {filteredTallies.map(([variety, data], idx) => (
                                                <li key={idx} className="p-4 flex justify-between items-center hover:bg-slate-50 transition">
                                                    <div>
                                                        <span className="font-bold text-slate-800 block">{variety}</span>
                                                        <span className="text-xs text-slate-500 font-medium flex items-center gap-1 mt-0.5">
                                                            <MapPin className="w-3 h-3" /> Row(s): {Array.from(data.rows).sort((a,b)=>a-b).join(', ')}
                                                        </span>
                                                    </div>
                                                    <span className="bg-emerald-100 text-emerald-800 font-black px-3 py-1.5 rounded-xl text-sm border border-emerald-200">{data.count}</span>
                                                </li>
                                            ))}
                                        </ul>
                                    )}
                                </div>
                                <div className="p-4 border-t shrink-0">
                                    <button onClick={() => {setShowStatsModal(false); setTallySearch('');}} className="w-full px-4 py-2.5 bg-slate-100 text-slate-700 font-bold rounded-xl hover:bg-slate-200 transition">Close Board</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Manual Insert/Edit Modal */}
                    {isManualModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden animate-in zoom-in-95">
                                <div className="flex justify-between items-center p-4 border-b bg-emerald-50">
                                    <h3 className="font-bold text-lg text-emerald-900">{editingPlant ? 'Edit Plant Details' : 'Insert Plant'}</h3>
                                    <button onClick={() => setIsManualModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                                </div>
                                <form 
                                    className="p-4 space-y-4"
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        const formData = new FormData(e.target);
                                        attemptSavePlant({
                                            row: parseInt(formData.get('row'), 10),
                                            position: parseInt(formData.get('position'), 10),
                                            variety: formatTitleCase(formData.get('variety')),
                                            status: formData.get('status'),
                                            notes: formData.get('notes'),
                                            photo: editingPlant?.photo || null,
                                            id: editingPlant?.id || null
                                        }, true); 
                                    }}
                                >
                                    {!editingPlant && (
                                        <div className="bg-amber-50 text-amber-800 p-3 rounded-lg text-xs font-medium border border-amber-200">
                                            <Info className="w-4 h-4 inline mr-1 -mt-0.5" />
                                            If a plant already exists at this Position, inserting here will shift all following plants up by 1.
                                        </div>
                                    )}
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-sm font-medium text-slate-700">Row</label>
                                            <input type="number" name="row" required min="1" defaultValue={editingPlant?.row || currentRow} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-sm font-medium text-slate-700">Position</label>
                                            <input type="number" name="position" required min="1" defaultValue={editingPlant?.position || currentPosition} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" />
                                        </div>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700">Variety Name</label>
                                        <input type="text" name="variety" required defaultValue={editingPlant?.variety || ''} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none" placeholder="e.g. Cafe Au Lait" />
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700">Plant Status</label>
                                        <select name="status" defaultValue={editingPlant?.status || 'active'} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none bg-white">
                                            <option value="active">🌱 Healthy / Active</option>
                                            <option value="failed">❌ Did Not Grow (Failed)</option>
                                            <option value="skipped">🪨 Empty Space (Skipped)</option>
                                        </select>
                                    </div>
                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700">Additional Notes</label>
                                        <textarea name="notes" rows="2" defaultValue={editingPlant?.notes || ''} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-emerald-500 outline-none resize-none"></textarea>
                                    </div>
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setIsManualModalOpen(false)} className="flex-1 px-4 py-2 border border-slate-200 text-slate-700 rounded-xl hover:bg-slate-50 transition font-medium">Cancel</button>
                                        <button type="submit" className="flex-1 px-4 py-2 bg-emerald-700 text-white rounded-xl hover:bg-emerald-800 transition font-bold shadow-md">Save & Shift</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {/* Shift Delete Confirmation Modal */}
                    {plantToDelete && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden animate-in zoom-in-95 p-5 text-center">
                                <div className="w-16 h-16 bg-red-100 text-red-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <Trash2 className="w-8 h-8" />
                                </div>
                                <h3 className="font-bold text-xl text-slate-900 mb-2">Delete Position {plantToDelete.position}?</h3>
                                <p className="text-slate-600 text-sm mb-6">
                                    Are you sure you want to delete <strong>{plantToDelete.variety}</strong>? 
                                    <br/><br/>
                                    <span className="bg-amber-50 text-amber-800 p-2 block rounded border border-amber-200 font-medium">
                                        This will permanently remove it and <strong>shift all following plants down by 1 position</strong> to close the gap.
                                    </span>
                                </p>
                                <div className="flex gap-3">
                                    <button onClick={() => setPlantToDelete(null)} className="flex-1 px-4 py-2 border border-slate-200 text-slate-700 rounded-xl hover:bg-slate-50 transition font-medium">Cancel</button>
                                    <button onClick={confirmDeletePlant} className="flex-1 px-4 py-2 bg-red-600 text-white rounded-xl hover:bg-red-700 transition font-bold shadow-md shadow-red-200">Delete & Shift</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Smart Duplicate Warning Modal */}
                    {duplicateWarning && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-sm shadow-xl overflow-hidden animate-in zoom-in-95 p-5 text-center border-t-8 border-amber-400">
                                <div className="w-16 h-16 bg-amber-100 text-amber-600 rounded-full flex items-center justify-center mx-auto mb-4">
                                    <AlertCircle className="w-8 h-8" />
                                </div>
                                <h3 className="font-black text-xl text-slate-900 mb-1 uppercase tracking-tight">Possible Duplicate</h3>
                                <p className="text-slate-600 text-sm mb-5">
                                    You already planted <strong>{duplicateWarning.existingCount}</strong> of <strong>{duplicateWarning.variety}</strong> earlier.
                                    <br/>They are currently in <strong>Row(s) {duplicateWarning.existingRows}</strong>.
                                </p>
                                <div className="flex flex-col gap-2.5">
                                    <button 
                                        onClick={() => {
                                            const parts = duplicateWarning.existingRows.split(', ');
                                            const lastRow = parseInt(parts[parts.length - 1], 10);
                                            handleRowChange(lastRow);
                                            setDuplicateWarning(null);
                                        }} 
                                        className="w-full px-4 py-2.5 bg-emerald-700 text-white rounded-xl hover:bg-emerald-800 transition font-medium shadow-md flex items-center justify-center gap-2"
                                    >
                                        <MapPin className="w-4 h-4"/> Jump to Row {duplicateWarning.existingRows.split(', ').pop()}
                                    </button>
                                    <button 
                                        onClick={() => executeSaveToCloud(duplicateWarning)} 
                                        className="w-full px-4 py-2.5 border-2 border-amber-400 text-amber-700 rounded-xl hover:bg-amber-50 transition font-bold"
                                    >
                                        Plant it Anyway
                                    </button>
                                    <button 
                                        onClick={() => setDuplicateWarning(null)} 
                                        className="w-full px-4 py-2 text-slate-500 hover:bg-slate-50 rounded-xl transition font-medium"
                                    >
                                        Cancel Entry
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {viewingPhoto && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setViewingPhoto(null)}>
                            <button onClick={() => setViewingPhoto(null)} className="absolute top-4 right-4 text-white bg-black/50 p-2 rounded-full hover:bg-white/20 transition">
                                <X className="w-6 h-6" />
                            </button>
                            <img src={viewingPhoto} alt="Dahlia" className="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain animate-in zoom-in-95" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
