<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Golden Belt Dahlia Farm</title>
    
    <!-- Mobile App Settings & Home Screen Icon -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Golden Belt">
    <link rel="apple-touch-icon" href="icon.png">
    <link rel="icon" type="image/png" href="icon.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Babel for in-browser JSX compilation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Import Maps for React, Lucide Icons, and Firebase -->
    <script type="importmap">
    {
        "imports": {
            "react": "https://esm.sh/react@18.2.0",
            "react-dom/client": "https://esm.sh/react-dom@18.2.0/client",
            "lucide-react": "https://esm.sh/lucide-react@0.292.0",
            "firebase/app": "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js",
            "firebase/auth": "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js",
            "firebase/firestore": "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js"
        }
    }
    </script>
</head>
<body class="bg-[#f4f1ea] overscroll-none">
    <div id="root"></div>

    <script type="text/babel" data-type="module">
        import React, { useState, useEffect, useRef, useMemo } from 'react';
        import { createRoot } from 'react-dom/client';
        import { 
          Mic, MicOff, Plus, Minus, Edit2, Trash2, Download, 
          X, AlertCircle, CheckCircle2, Info, MapPin, 
          Camera, Image as ImageIcon, FileText, HelpCircle,
          Ban, LeafyGreen, List, Eye, Search, ChevronDown, Calendar, AlertTriangle, Sprout
        } from 'lucide-react';
        
        import { initializeApp } from 'firebase/app';
        import { getAuth, signInAnonymously, onAuthStateChanged } from 'firebase/auth';
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from 'firebase/firestore';

        // ======================================================================
        // YOUR LIVE FIREBASE CONFIG
        // ======================================================================
        const firebaseConfig = {
          apiKey: "AIzaSyCJob-YrKAmXpF0zkdrh4t7R__k9M3CiFw",
          authDomain: "dahlia-farm-pro.firebaseapp.com",
          projectId: "dahlia-farm-pro",
          storageBucket: "dahlia-farm-pro.firebasestorage.app",
          messagingSenderId: "350375032767",
          appId: "1:350375032767:web:ca63c5cf7e0a64d616530a"
        };
        // ======================================================================

        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase initialization failed:", error);
        }

        // Custom Golden Belt Logo SVG
        const GoldenBeltLogo = ({ className }) => (
            <svg className={className} viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="50" cy="50" r="45" fill="#047857"/>
                <path d="M 5 50 A 45 45 0 0 0 95 50" stroke="#F59E0B" strokeWidth="12" />
                <path d="M 5 50 A 45 45 0 0 1 95 50" stroke="#FCD34D" strokeWidth="3" />
                <path d="M50 12 L56 36 L80 36 L61 50 L68 74 L50 58 L32 74 L39 50 L20 36 L44 36 Z" fill="#FBBF24" stroke="#FEF3C7" strokeWidth="2" strokeLinejoin="round"/>
            </svg>
        );

        // Smart Dictionary Fuzzy Match Engine (Levenshtein Distance)
        const getLevenshteinDistance = (a, b) => {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matrix = [];
            for (let i = 0; i <= b.length; i++) { matrix[i] = [i]; }
            for (let j = 0; j <= a.length; j++) { matrix[0][j] = j; }
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) == a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(matrix[i - 1][j - 1] + 1, Math.min(matrix[i][j - 1] + 1, matrix[i - 1][j] + 1));
                    }
                }
            }
            return matrix[b.length][a.length];
        };

        function App() {
            const [user, setUser] = useState(null);
            const [plants, setPlants] = useState([]);
            const [isLoading, setIsLoading] = useState(true);
            
            const currentYear = new Date().getFullYear().toString();
            const [selectedYear, setSelectedYear] = useState(currentYear);
            
            const [currentRow, setCurrentRow] = useState(1);
            const [currentPosition, setCurrentPosition] = useState(1);
            const [viewMode, setViewMode] = useState('current');
            const [searchQuery, setSearchQuery] = useState('');

            const [isListening, setIsListening] = useState(false);
            const [feedback, setFeedback] = useState({ message: '', type: '' });
            const [speechSupported, setSpeechSupported] = useState(true);
            const [editingPlant, setEditingPlant] = useState(null);
            const [isManualModalOpen, setIsManualModalOpen] = useState(false);
            const [showCommandsHelp, setShowCommandsHelp] = useState(false);
            const [viewingPhoto, setViewingPhoto] = useState(null);
            const [isCompressing, setIsCompressing] = useState(false);
            
            // New states for the advanced duplicate workflow
            const [lastEnteredVariety, setLastEnteredVariety] = useState(null);
            const [duplicateWarning, setDuplicateWarning] = useState(null); // { plantData, matches }
            
            const recognitionRef = useRef(null);
            const listEndRef = useRef(null);
            
            // Track initialization per year so smart resume works when switching years
            const initializedYearsRef = useRef({});

            useEffect(() => {
                const timer = setTimeout(() => setIsLoading(false), 4000);
                return () => clearTimeout(timer);
            }, []);

            useEffect(() => {
                if (viewMode === 'current' && listEndRef.current && !searchQuery) {
                    listEndRef.current.scrollIntoView({ behavior: 'smooth' });
                }
            }, [plants, currentPosition, viewMode, searchQuery]);

            // Auth
            useEffect(() => {
                if (!auth) {
                    setIsLoading(false);
                    return;
                }
                signInAnonymously(auth).catch((error) => {
                    console.error("Auth error:", error);
                    setIsLoading(false); 
                });
                
                const unsubscribe = onAuthStateChanged(auth, (currentUser) => {
                    setUser(currentUser);
                    if (!currentUser) setIsLoading(false);
                });
                return () => unsubscribe();
            }, []);

            // Data Sync & Smart Resume Logic (Dependent on selectedYear)
            useEffect(() => {
                if (!user || !db) return;
                
                setIsLoading(true);
                // Dynamically fetch from the selected year's collection
                const plantsRef = collection(db, `plants_${selectedYear}`);
                
                const unsubscribe = onSnapshot(plantsRef, (snapshot) => {
                    const loadedPlants = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                    setPlants(loadedPlants);
                    
                    // Smart Resume: Auto-jump to furthest position on startup per year
                    if (!initializedYearsRef.current[selectedYear]) {
                        if (loadedPlants.length > 0) {
                            const maxRow = Math.max(...loadedPlants.map(p => p.row));
                            const plantsInMaxRow = loadedPlants.filter(p => p.row === maxRow);
                            const maxPos = plantsInMaxRow.length > 0 ? Math.max(...plantsInMaxRow.map(p => p.position)) : 0;
                            
                            setCurrentRow(maxRow);
                            setCurrentPosition(maxPos + 1);
                        } else {
                            // Reset for empty years
                            setCurrentRow(1);
                            setCurrentPosition(1);
                        }
                        initializedYearsRef.current[selectedYear] = true;
                    }
                    
                    setIsLoading(false);
                }, (error) => {
                    setFeedback({ message: 'Offline mode active. Data saving locally.', type: 'info' });
                    setIsLoading(false);
                });
                return () => unsubscribe();
            }, [user, selectedYear]);

            const getPlantId = (row, pos) => {
                return `${row}${pos.toString().padStart(2, '0')}`;
            };

            const normalizeTranscript = (text) => {
                const wordToNum = {
                    'one': 1, 'two': 2, 'to': 2, 'too': 2, 'three': 3, 'four': 4, 'for': 4,
                    'five': 5, 'six': 6, 'seven': 7, 'eight': 8, 'nine': 9, 'ten': 10,
                    'eleven': 11, 'twelve': 12, 'thirteen': 13, 'fourteen': 14, 'fifteen': 15,
                    'sixteen': 16, 'seventeen': 17, 'eighteen': 18, 'nineteen': 19, 'twenty': 20
                };
                return text.toLowerCase().split(' ').map(word => wordToNum[word] !== undefined ? wordToNum[word] : word).join(' ');
            };

            // Smart Dictionary Check
            const applySmartDictionary = (inputVariety) => {
                if (inputVariety.toLowerCase() === 'empty space') return inputVariety;
                
                const uniqueExistingVarieties = [...new Set(plants.map(p => p.variety).filter(v => v !== 'Empty Space'))];
                let bestMatch = inputVariety;
                let lowestDistance = Infinity;

                uniqueExistingVarieties.forEach(existing => {
                    const distance = getLevenshteinDistance(inputVariety.toLowerCase(), existing.toLowerCase());
                    // If the word is long enough, allow up to 2 character typos. If short, require closer match.
                    const threshold = existing.length > 6 ? 2 : 1;
                    if (distance <= threshold && distance < lowestDistance) {
                        lowestDistance = distance;
                        bestMatch = existing; // Auto-correct to exactly how she typed it before
                    }
                });

                return bestMatch;
            };

            // Speech Rec
            useEffect(() => {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                if (!SpeechRecognition) {
                    setSpeechSupported(false);
                    return;
                }

                const recognition = new SpeechRecognition();
                recognition.continuous = false; 
                recognition.interimResults = false;
                recognition.lang = 'en-US';

                recognition.onresult = (event) => {
                    const lastResultIndex = event.results.length - 1;
                    const transcript = event.results[lastResultIndex][0].transcript.trim();
                    processTranscript(transcript);
                };

                recognition.onerror = (event) => {
                    if (event.error !== 'no-speech') {
                        showFeedback(`Microphone error: ${event.error}`, 'error');
                        forceStopMic();
                    }
                };

                recognition.onend = () => setIsListening(false);
                recognitionRef.current = recognition;

                return () => {
                    if (recognitionRef.current) recognitionRef.current.stop();
                };
            }, [currentRow, currentPosition, plants, selectedYear]);

            const forceStopMic = () => {
                if (recognitionRef.current) recognitionRef.current.stop();
                setIsListening(false);
            };

            const showFeedback = (message, type) => {
                setFeedback({ message, type });
                setTimeout(() => setFeedback({ message: '', type: '' }), 4000);
            };

            const toggleListening = () => {
                if (!speechSupported) {
                    showFeedback('Voice not supported on this browser.', 'error');
                    return;
                }
                if (isListening) {
                    forceStopMic();
                    showFeedback('Voice tracking paused.', 'info');
                } else {
                    try {
                        recognitionRef.current.start();
                        setIsListening(true);
                        showFeedback('Listening...', 'info');
                    } catch (e) {
                        console.error(e);
                    }
                }
            };

            const handleRowChange = (newRow) => {
                if (newRow < 1) return;
                setCurrentRow(newRow);
                const plantsInRow = plants.filter(p => p.row === newRow);
                const maxPos = plantsInRow.length > 0 ? Math.max(...plantsInRow.map(p => p.position)) : 0;
                setCurrentPosition(maxPos + 1);
            };

            const processTranscript = (rawText) => {
                const normalizedText = normalizeTranscript(rawText).trim();

                if (normalizedText.match(/^(next|advance)\s*row$/)) {
                    handleRowChange(currentRow + 1);
                    showFeedback(`Moved to Row ${currentRow + 1}`, 'info');
                    return forceStopMic();
                }

                const rowMatch = normalizedText.match(/^(?:go to|jump to|move to|change to|set)?\s*row\s*(\d+)$/);
                if (rowMatch) {
                    const r = parseInt(rowMatch[1], 10);
                    handleRowChange(r);
                    showFeedback(`Moved to Row ${r}`, 'info');
                    return forceStopMic();
                }

                const posMatch = normalizedText.match(/^(?:go to|jump to|move to|change to|set)?\s*(?:plant|position|number|num)\s*(\d+)$/);
                if (posMatch) {
                    const p = parseInt(posMatch[1], 10);
                    setCurrentPosition(p);
                    showFeedback(`Jumped to Plant ${p}`, 'info');
                    return forceStopMic();
                }

                if (normalizedText.match(/^(skip space|empty space|leave empty|mark empty)$/)) {
                    handleAttemptSave({ row: currentRow, position: currentPosition, variety: 'Empty Space', notes: '', photo: null, status: 'skipped' });
                    return forceStopMic();
                }

                if (normalizedText.match(/^(did not grow|didn't grow|failed|dead|mark failed)$/)) {
                    const existingPlant = plants.find(p => p.row === currentRow && p.position === currentPosition);
                    if (existingPlant) {
                        savePlantToCloud({ ...existingPlant, status: 'failed' });
                        showFeedback(`Marked ${existingPlant.variety} as Failed.`, 'info');
                        setCurrentPosition(prev => prev + 1);
                    } else {
                        showFeedback(`No plant found at Plant ${currentPosition} to mark as failed.`, 'error');
                    }
                    return forceStopMic();
                }

                let variety = rawText.replace(/^(is|called|variety)\s+/i, '').trim().replace(/\b\w/g, l => l.toUpperCase());

                if (variety) {
                    variety = applySmartDictionary(variety); // Run it through the learning engine
                    handleAttemptSave({ row: currentRow, position: currentPosition, variety, notes: '', photo: null, status: 'active' });
                    forceStopMic(); 
                } else {
                    showFeedback(`Didn't catch the variety name.`, 'error');
                    forceStopMic();
                }
            };

            // Gatekeeper function to catch duplicates before saving
            const handleAttemptSave = (plantData, isEditMode = false) => {
                // Ignore duplicate checks for Empty Spaces or if we are actively editing an existing plant
                if (plantData.variety === 'Empty Space' || isEditMode) {
                    savePlantToCloud(plantData);
                    showFeedback(`Added: ${plantData.variety}`, 'success');
                    if (!isEditMode) setCurrentPosition(prev => prev + 1);
                    return;
                }

                // Check for matches in the entire field
                const matches = plants.filter(p => p.variety.toLowerCase() === plantData.variety.toLowerCase() && p.status !== 'skipped');
                
                // Check if this is an intentional consecutive planting
                const isSameAsLastState = lastEnteredVariety && lastEnteredVariety.toLowerCase() === plantData.variety.toLowerCase();
                const prevPlant = plants.find(p => p.row === currentRow && p.position === currentPosition - 1);
                const isSameAsPrevPos = prevPlant && prevPlant.variety.toLowerCase() === plantData.variety.toLowerCase();
                
                const isConsecutive = isSameAsLastState || isSameAsPrevPos;

                if (matches.length > 0 && !isConsecutive) {
                    // Trigger duplicate warning
                    setDuplicateWarning({ plantData, matches });
                } else {
                    // Clean save
                    savePlantToCloud(plantData);
                    showFeedback(`Added: ${plantData.variety}`, 'success');
                    setCurrentPosition(prev => prev + 1);
                }
            };

            const confirmDuplicateSave = () => {
                savePlantToCloud(duplicateWarning.plantData);
                showFeedback(`Added Duplicate: ${duplicateWarning.plantData.variety}`, 'success');
                setCurrentPosition(prev => prev + 1);
                setDuplicateWarning(null);
            };

            const jumpToDuplicate = () => {
                // Jump to the row of the most recently added duplicate of this variety
                const mostRecent = duplicateWarning.matches.reduce((prev, current) => (prev.row > current.row) ? prev : current);
                handleRowChange(mostRecent.row);
                showFeedback(`Jumped to Row ${mostRecent.row} to plant with others.`, 'info');
                setDuplicateWarning(null);
            };

            const savePlantToCloud = async (plantData) => {
                const existingPlant = plants.find(p => p.row === plantData.row && p.position === plantData.position);
                const idToUse = plantData.id || (existingPlant ? existingPlant.id : Date.now().toString());
                const dataToSave = existingPlant ? { ...existingPlant, ...plantData, id: idToUse } : { ...plantData, id: idToUse };
                
                if (!dataToSave.status) dataToSave.status = 'active';

                setPlants(prev => {
                    const newPlants = [...prev];
                    const idx = newPlants.findIndex(p => p.id === idToUse);
                    if (idx >= 0) newPlants[idx] = dataToSave;
                    else newPlants.push(dataToSave);
                    return newPlants;
                });
                
                // Track the last intentionally planted variety to allow consecutive duplicates smoothly
                if (plantData.variety !== 'Empty Space') {
                    setLastEnteredVariety(plantData.variety);
                }

                if (!user || !db) return; 
                
                try {
                    // Save to the currently selected year's collection
                    const docRef = doc(db, `plants_${selectedYear}`, idToUse);
                    await setDoc(docRef, dataToSave);
                } catch (err) {
                    console.error("Error saving:", err);
                }
            };

            const deletePlant = async (id) => {
                setPlants(prev => prev.filter(p => p.id !== id));
                if (!user || !db) return;
                try {
                    await deleteDoc(doc(db, `plants_${selectedYear}`, id));
                } catch (err) {
                    console.error("Error deleting:", err);
                }
            };

            const handlePhotoCapture = async (e, plant) => {
                const file = e.target.files[0];
                if (!file) return;

                setIsCompressing(true);
                showFeedback('Optimizing photo...', 'info');

                try {
                    const compressedDataUrl = await compressImage(file);
                    await savePlantToCloud({ ...plant, photo: compressedDataUrl });
                    showFeedback('Photo attached successfully!', 'success');
                } catch (err) {
                    showFeedback('Failed to process photo.', 'error');
                } finally {
                    setIsCompressing(false);
                    e.target.value = ''; 
                }
            };

            const compressImage = (file) => {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = (event) => {
                        const img = new Image();
                        img.onload = () => {
                            const canvas = document.createElement('canvas');
                            const MAX_WIDTH = 800;
                            const scaleSize = MAX_WIDTH / img.width;
                            canvas.width = MAX_WIDTH;
                            canvas.height = img.height * scaleSize;
                            const ctx = canvas.getContext('2d');
                            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                            resolve(canvas.toDataURL('image/jpeg', 0.6));
                        };
                        img.onerror = reject;
                        img.src = event.target.result;
                    };
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            };

            const exportToCSV = () => {
                if (plants.length === 0) return alert("No data to export!");
                
                const sortedPlants = [...plants].sort((a, b) => a.row !== b.row ? a.row - b.row : a.position - b.position);

                const headers = ['Plant ID', 'Row', 'Position', 'Variety', 'Status', 'Notes', 'Has Photo', 'Date Logged'];
                const rows = sortedPlants.map(p => [
                    getPlantId(p.row, p.position),
                    p.row, 
                    p.position, 
                    `"${p.variety || ''}"`, 
                    p.status || 'active',
                    `"${(p.notes || '').replace(/"/g, '""')}"`, 
                    p.photo ? 'Yes' : 'No',
                    new Date(parseInt(p.id)).toLocaleDateString()
                ]);

                const csvContent = "data:text/csv;charset=utf-8," + [headers.join(","), ...rows.map(e => e.join(","))].join("\n");
                const encodedUri = encodeURI(csvContent);
                const link = document.createElement("a");
                link.setAttribute("href", encodedUri);
                link.setAttribute("download", `golden_belt_dahlias_${selectedYear}_${new Date().toISOString().split('T')[0]}.csv`);
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            };

            const filteredPlants = useMemo(() => {
                if (!searchQuery) return plants;
                const lowerQuery = searchQuery.toLowerCase();
                return plants.filter(p => 
                    p.variety.toLowerCase().includes(lowerQuery) || 
                    (p.notes && p.notes.toLowerCase().includes(lowerQuery)) ||
                    getPlantId(p.row, p.position).includes(lowerQuery)
                );
            }, [plants, searchQuery]);

            const groupedPlants = useMemo(() => {
                const groups = filteredPlants.reduce((acc, plant) => {
                    if (!acc[plant.row]) acc[plant.row] = [];
                    acc[plant.row].push(plant);
                    return acc;
                }, {});
                Object.keys(groups).forEach(row => groups[row].sort((a, b) => a.position - b.position));
                return groups;
            }, [filteredPlants]);

            const availableRows = useMemo(() => {
                return [...new Set(plants.map(p => p.row))].sort((a, b) => a - b);
            }, [plants]);

            const rowsToRender = searchQuery 
                ? Object.keys(groupedPlants).sort((a,b) => Number(a) - Number(b))
                : (viewMode === 'current' 
                    ? (groupedPlants[currentRow] ? [currentRow.toString()] : []) 
                    : Object.keys(groupedPlants).sort((a,b) => Number(a) - Number(b)));

            if (isLoading) {
                return (
                    <div className="min-h-screen bg-[#f4f1ea] flex items-center justify-center font-sans text-emerald-900">
                        <div className="animate-pulse flex flex-col items-center">
                            <GoldenBeltLogo className="w-16 h-16 mb-4 drop-shadow-lg" />
                            <p className="font-medium tracking-wide">Loading {selectedYear} Database...</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#f4f1ea] font-sans text-slate-800 flex flex-col overflow-hidden">
                    
                    <header className="bg-emerald-900 text-white p-3 shadow-md z-20 shrink-0">
                        <div className="max-w-4xl mx-auto flex justify-between items-center">
                            <div className="flex items-center gap-2.5">
                                <GoldenBeltLogo className="w-7 h-7 drop-shadow-md" />
                                <div>
                                    <h1 className="text-lg font-bold tracking-wide leading-tight text-emerald-50">Golden Belt</h1>
                                    <p className="text-[10px] text-amber-400 font-semibold tracking-widest uppercase leading-none">Dahlia Farm</p>
                                </div>
                            </div>
                            
                            <div className="flex items-center gap-2">
                                {/* Year Selector */}
                                <div className="relative flex items-center bg-emerald-800 border border-emerald-700 rounded-lg px-2 py-1.5 cursor-pointer hover:bg-emerald-700 transition">
                                    <Calendar className="w-3.5 h-3.5 text-emerald-300 mr-1.5" />
                                    <select 
                                        value={selectedYear}
                                        onChange={(e) => setSelectedYear(e.target.value)}
                                        className="appearance-none bg-transparent text-xs font-bold text-white outline-none cursor-pointer pr-4"
                                    >
                                        <option value="2026">2026</option>
                                        <option value="2027">2027</option>
                                        <option value="2028">2028</option>
                                        <option value="2029">2029</option>
                                        <option value="2030">2030</option>
                                    </select>
                                    <ChevronDown className="w-3 h-3 absolute right-1.5 top-1/2 -translate-y-1/2 pointer-events-none text-emerald-300" />
                                </div>

                                <button onClick={() => { setViewMode(viewMode === 'current' ? 'all' : 'current'); setSearchQuery(''); }} className="flex items-center gap-1 bg-emerald-800 hover:bg-emerald-700 px-2 py-1.5 rounded-lg text-xs transition-colors border border-emerald-700">
                                    {viewMode === 'current' ? <List className="w-4 h-4 text-emerald-300" /> : <Eye className="w-4 h-4 text-emerald-300" />}
                                    <span className="hidden sm:inline">{viewMode === 'current' ? 'View All' : 'Focus Row'}</span>
                                </button>
                                <button onClick={exportToCSV} className="flex items-center gap-1 bg-amber-500 hover:bg-amber-400 text-amber-950 font-semibold px-2 py-1.5 rounded-lg text-xs transition-colors shadow-sm">
                                    <Download className="w-4 h-4" />
                                    <span className="hidden sm:inline">Export</span>
                                </button>
                            </div>
                        </div>
                    </header>

                    <div className="bg-white border-b border-emerald-100 shadow-sm shrink-0 z-10 sticky top-0">
                        <div className="max-w-4xl mx-auto p-2 flex gap-2">
                            <div className="relative flex-1">
                                <Search className="absolute left-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-400" />
                                <input 
                                    type="text" 
                                    placeholder="Search variety or ID..." 
                                    value={searchQuery}
                                    onChange={(e) => setSearchQuery(e.target.value)}
                                    className="w-full pl-8 pr-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-amber-400 focus:bg-white transition-colors"
                                />
                                {searchQuery && (
                                    <button onClick={() => setSearchQuery('')} className="absolute right-2 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600">
                                        <X className="w-3.5 h-3.5" />
                                    </button>
                                )}
                            </div>

                            <div className="relative w-36">
                                <select 
                                    value={viewMode === 'current' && !searchQuery ? currentRow : ''}
                                    onChange={(e) => {
                                        const r = parseInt(e.target.value, 10);
                                        if(r) {
                                            handleRowChange(r);
                                            setViewMode('current');
                                            setSearchQuery('');
                                        }
                                    }}
                                    className="w-full appearance-none bg-emerald-50 border border-emerald-200 text-emerald-800 font-medium text-sm rounded-lg pl-3 pr-8 py-2 focus:outline-none focus:ring-2 focus:ring-emerald-500 cursor-pointer"
                                >
                                    <option value="" disabled>Jump Row...</option>
                                    {availableRows.map(r => (
                                        <option key={r} value={r}>Row {r}</option>
                                    ))}
                                </select>
                                <ChevronDown className="absolute right-2.5 top-1/2 -translate-y-1/2 w-4 h-4 text-emerald-600 pointer-events-none" />
                            </div>
                        </div>
                    </div>

                    <main className="flex-1 overflow-y-auto w-full max-w-4xl mx-auto p-4 pb-36">
                        <div className="flex justify-between items-center mb-4">
                            <button onClick={() => setShowCommandsHelp(!showCommandsHelp)} className="text-emerald-700 text-sm font-medium flex items-center gap-1 bg-emerald-100 px-3 py-1.5 rounded-full hover:bg-emerald-200 transition-colors">
                                <HelpCircle className="w-4 h-4" /> Voice Commands
                            </button>
                            <button onClick={() => { setEditingPlant(null); setIsManualModalOpen(true); }} className="text-sm flex items-center gap-1 bg-slate-800 text-white px-3 py-1.5 rounded-full shadow-sm hover:bg-slate-700 transition">
                                <Plus className="w-4 h-4" /> Manual Entry
                            </button>
                        </div>

                        {showCommandsHelp && (
                            <div className="bg-emerald-50 rounded-xl p-4 mb-6 border border-emerald-100 text-sm animate-in fade-in slide-in-from-top-2">
                                <h3 className="font-bold text-emerald-900 mb-2 border-b border-emerald-200 pb-1">Voice Commands:</h3>
                                <ul className="space-y-1.5 text-emerald-800">
                                    <li><strong className="text-emerald-900">"[Variety]"</strong> - Logs plant & auto-corrects spelling</li>
                                    <li><strong className="text-emerald-900">"Empty Space"</strong> - Logs a physical gap</li>
                                    <li><strong className="text-emerald-900">"Did not grow"</strong> - Marks selected plant as failed</li>
                                    <li><strong className="text-emerald-900">"Row 4"</strong> or <strong className="text-emerald-900">"Next row"</strong> - Moves row tracker</li>
                                    <li><strong className="text-emerald-900">"Plant 12"</strong> - Jumps to specific plant</li>
                                </ul>
                            </div>
                        )}

                        <section className="space-y-6">
                            {rowsToRender.length === 0 ? (
                                <div className="text-center py-12 bg-white rounded-2xl border border-dashed border-emerald-200 text-emerald-600/60 mt-4">
                                    {searchQuery ? (
                                        <Search className="w-12 h-12 mx-auto mb-3 opacity-30" />
                                    ) : (
                                        <Sprout className="w-12 h-12 mx-auto mb-3 opacity-50 text-emerald-700" />
                                    )}
                                    <p className="font-medium text-emerald-800">
                                        {searchQuery ? 'No plants found matching your search.' : `Row ${currentRow} is empty.`}
                                    </p>
                                    {!searchQuery && <p className="text-sm mt-1">Tap the mic below to log your first tuber here.</p>}
                                </div>
                            ) : (
                                rowsToRender.map(rowNum => (
                                    <div key={rowNum} className="bg-white rounded-2xl shadow-[0_2px_10px_rgba(0,0,0,0.04)] border border-emerald-100 overflow-hidden">
                                        <div className="bg-emerald-50/80 px-4 py-3 border-b border-emerald-100 flex justify-between items-center sticky top-0 z-10 shadow-sm backdrop-blur-sm">
                                            <h3 className="font-bold text-emerald-900 text-lg flex items-center gap-2">Row {rowNum}</h3>
                                            <span className="text-xs font-semibold bg-white text-emerald-700 px-2 py-1 rounded-full shadow-sm border border-emerald-100">{groupedPlants[rowNum].length} entries</span>
                                        </div>
                                        
                                        <div className="divide-y divide-slate-100">
                                            {groupedPlants[rowNum].map(plant => {
                                                const isSkipped = plant.status === 'skipped';
                                                const isFailed = plant.status === 'failed';
                                                const isJustAdded = !searchQuery && Number(rowNum) === currentRow && plant.position === currentPosition - 1;
                                                const plantId = getPlantId(plant.row, plant.position);
                                                
                                                return (
                                                    <div key={plant.id} className={`p-4 flex flex-col sm:flex-row sm:items-center justify-between transition-colors gap-4 
                                                        ${isSkipped ? 'bg-slate-50 opacity-70 border-l-4 border-slate-300' : 
                                                        isFailed ? 'bg-red-50/50 hover:bg-red-50 border-l-4 border-red-300' : 
                                                        isJustAdded ? 'bg-emerald-50/50 border-l-4 border-amber-400' :
                                                        'hover:bg-slate-50 border-l-4 border-transparent'}
                                                    `}>
                                                        
                                                        <div className="flex items-start sm:items-center gap-4 flex-1">
                                                            
                                                            <div className={`w-14 h-10 rounded-xl flex flex-col items-center justify-center font-bold shrink-0 mt-1 sm:mt-0 shadow-sm border
                                                                ${isSkipped ? 'bg-slate-200 text-slate-500 border-slate-300' :
                                                                isFailed ? 'bg-red-100 text-red-700 border-red-200' :
                                                                'bg-gradient-to-br from-amber-300 to-amber-500 text-amber-950 border-amber-400'}`}
                                                            >
                                                                <span className="text-[9px] uppercase tracking-widest opacity-80 -mb-1 font-bold">ID</span>
                                                                <span className="text-base">#{plantId}</span>
                                                            </div>
                                                            
                                                            <div className="flex-1">
                                                                <div className="flex items-center gap-2">
                                                                    {isSkipped ? <Ban className="w-4 h-4 text-slate-400" /> : 
                                                                    isFailed ? <AlertCircle className="w-4 h-4 text-red-500" /> : 
                                                                    <LeafyGreen className="w-4 h-4 text-emerald-500" />}
                                                                    
                                                                    <p className={`font-semibold text-lg ${isSkipped ? 'text-slate-500 italic' : isFailed ? 'text-red-900 line-through' : 'text-slate-800'}`}>
                                                                        {plant.variety}
                                                                    </p>
                                                                    
                                                                    {plant.photo && (
                                                                        <button onClick={() => setViewingPhoto(plant.photo)} className="text-emerald-600 hover:text-emerald-700 bg-emerald-50 p-1 rounded-md transition-colors" title="View Photo">
                                                                            <ImageIcon className="w-4 h-4" />
                                                                        </button>
                                                                    )}
                                                                </div>
                                                                
                                                                {isFailed && <p className="text-xs text-red-600 font-medium mt-0.5">Did not grow</p>}
                                                                
                                                                {plant.notes && (
                                                                    <div className="flex items-start gap-1.5 mt-1.5 text-sm text-slate-600 bg-white p-2.5 rounded-lg border border-slate-200 shadow-sm">
                                                                        <FileText className="w-4 h-4 mt-0.5 shrink-0 text-slate-400" />
                                                                        <p className="leading-snug">{plant.notes}</p>
                                                                    </div>
                                                                )}
                                                            </div>
                                                        </div>

                                                        <div className="flex items-center gap-1 self-end sm:self-auto shrink-0 bg-white sm:bg-transparent p-1 sm:p-0 rounded-lg shadow-sm sm:shadow-none border border-slate-100 sm:border-none">
                                                            
                                                            <div className={`relative flex items-center gap-1 p-2 rounded-lg transition overflow-hidden cursor-pointer ${isSkipped ? 'opacity-50 cursor-not-allowed' : 'text-emerald-600 hover:bg-emerald-50'}`} title={isSkipped ? "Cannot add photo to skipped space" : "Add Photo"}>
                                                                <Camera className="w-5 h-5 relative z-10" />
                                                                <span className="text-sm font-medium sm:hidden relative z-10">Photo</span>
                                                                <input 
                                                                    type="file" 
                                                                    accept="image/*" 
                                                                    capture="environment" 
                                                                    className="absolute inset-0 w-full h-full opacity-0 cursor-pointer z-20" 
                                                                    disabled={isSkipped} 
                                                                    onChange={(e) => handlePhotoCapture(e, plant)} 
                                                                />
                                                            </div>

                                                            <div className="w-px h-6 bg-slate-200 mx-1 hidden sm:block"></div>
                                                            <button onClick={() => { setEditingPlant(plant); setIsManualModalOpen(true); }} className="p-2 text-slate-500 hover:text-amber-600 hover:bg-amber-50 rounded-lg transition"><Edit2 className="w-5 h-5" /></button>
                                                            <button onClick={() => deletePlant(plant.id)} className="p-2 text-slate-500 hover:text-red-600 hover:bg-red-50 rounded-lg transition"><Trash2 className="w-5 h-5" /></button>
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                        </div>
                                    </div>
                                ))
                            )}
                            <div ref={listEndRef} className="h-4"></div>
                        </section>
                    </main>

                    {}
                    <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-slate-200 shadow-[0_-10px_40px_rgba(0,0,0,0.08)] z-40 pb-6 pt-3 px-4 sm:pb-4">
                        <div className="absolute left-0 right-0 -top-14 flex justify-center pointer-events-none">
                            {feedback.message && (
                                <div className={`flex items-center gap-2 px-4 py-2 rounded-full text-sm font-medium shadow-lg animate-in fade-in slide-in-from-bottom-2 ${
                                    feedback.type === 'success' ? 'bg-emerald-600 text-white' :
                                    feedback.type === 'error' ? 'bg-red-600 text-white' : 'bg-slate-800 text-white'
                                }`}>
                                    {feedback.type === 'success' && <CheckCircle2 className="w-4 h-4 shrink-0" />}
                                    {feedback.type === 'error' && <AlertCircle className="w-4 h-4 shrink-0" />}
                                    {feedback.type === 'info' && <Info className="w-4 h-4 shrink-0" />}
                                    {feedback.message}
                                </div>
                            )}
                        </div>

                        {/* LIVE PLANT COUNT BADGE */}
                        {lastEnteredVariety && lastEnteredVariety !== 'Empty Space' && (
                            <div className="absolute left-0 right-0 -top-24 flex justify-center pointer-events-none">
                                <span className="inline-flex items-center gap-1.5 text-xs bg-amber-100 text-amber-900 px-3 py-1.5 rounded-full font-bold border border-amber-300 shadow-sm animate-in fade-in zoom-in">
                                    <Sprout className="w-3.5 h-3.5 text-emerald-600" />
                                    Planted {plants.filter(p => p.variety.toLowerCase() === lastEnteredVariety.toLowerCase() && p.status !== 'skipped').length} {lastEnteredVariety}
                                </span>
                            </div>
                        )}

                        <div className="max-w-md mx-auto relative flex justify-between items-center h-16">
                            <div className="flex flex-col items-center w-24">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Row</span>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => handleRowChange(currentRow - 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Minus className="w-5 h-5"/></button>
                                    <span className="text-2xl font-black text-slate-800 w-8 text-center">{currentRow}</span>
                                    <button onClick={() => handleRowChange(currentRow + 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Plus className="w-5 h-5"/></button>
                                </div>
                            </div>

                            <div className="absolute left-1/2 -translate-x-1/2 -top-10">
                                <button
                                    onClick={toggleListening}
                                    disabled={!speechSupported || isCompressing}
                                    className={`flex items-center justify-center w-20 h-20 rounded-full shadow-2xl border-[6px] border-white transition-all duration-300 ${
                                        isListening 
                                        ? 'bg-red-500 text-white animate-pulse scale-105 shadow-[0_0_20px_rgba(239,68,68,0.4)]' 
                                        : 'bg-emerald-700 text-white hover:bg-emerald-600 hover:scale-105'
                                    } ${(!speechSupported || isCompressing) && 'opacity-50 cursor-not-allowed'}`}
                                >
                                    {isListening ? <Mic className="w-8 h-8" /> : <MicOff className="w-8 h-8" />}
                                </button>
                                <div className={`text-center mt-1 text-[10px] font-bold tracking-wider uppercase ${isListening ? 'text-red-500' : 'text-slate-400'}`}>
                                    {isListening ? 'Listening' : 'Tap to Log'}
                                </div>
                            </div>

                            <div className="flex flex-col items-center w-24">
                                <span className="text-[10px] font-bold text-slate-400 uppercase tracking-wider mb-1">Next Plant</span>
                                <div className="flex items-center gap-2">
                                    <button onClick={() => setCurrentPosition(Math.max(1, currentPosition - 1))} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Minus className="w-5 h-5"/></button>
                                    <span className="text-2xl font-black text-slate-800 w-8 text-center">{currentPosition}</span>
                                    <button onClick={() => setCurrentPosition(currentPosition + 1)} className="p-1.5 text-slate-500 hover:bg-slate-100 rounded-full"><Plus className="w-5 h-5"/></button>
                                </div>
                            </div>
                        </div>
                    </div>

                    {}
                    {/* Duplicate Warning Modal */}
                    {duplicateWarning && (
                        <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4 z-[60]">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-2xl overflow-hidden animate-in zoom-in-95 border-2 border-amber-400">
                                <div className="bg-amber-50 p-4 border-b border-amber-200 flex items-center gap-3">
                                    <div className="bg-amber-100 p-2 rounded-full text-amber-600">
                                        <AlertTriangle className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h3 className="font-bold text-lg text-amber-900">Duplicate Variety Found!</h3>
                                        <p className="text-xs font-medium text-amber-700">You already planted this earlier.</p>
                                    </div>
                                </div>
                                <div className="p-6">
                                    <p className="text-slate-700 mb-4">
                                        You are about to log <strong className="text-slate-900">{duplicateWarning.plantData.variety}</strong>. 
                                        This variety has already been planted in <strong>Row {Array.from(new Set(duplicateWarning.matches.map(m => m.row))).join(', ')}</strong>.
                                    </p>
                                    <div className="bg-slate-50 p-3 rounded-lg border border-slate-200 flex items-center justify-between mb-6">
                                        <span className="text-sm font-medium text-slate-600">Total count if planted:</span>
                                        <span className="bg-amber-100 text-amber-800 font-bold px-3 py-1 rounded-full">
                                            {duplicateWarning.matches.length + 1} of this variety
                                        </span>
                                    </div>
                                    
                                    <div className="space-y-3">
                                        <button 
                                            onClick={jumpToDuplicate}
                                            className="w-full flex items-center justify-center gap-2 bg-emerald-700 text-white font-medium py-3 rounded-xl hover:bg-emerald-800 transition shadow-sm"
                                        >
                                            <MapPin className="w-5 h-5" /> Jump to Row {duplicateWarning.matches[0].row}
                                        </button>
                                        <div className="flex gap-3">
                                            <button 
                                                onClick={() => setDuplicateWarning(null)}
                                                className="flex-1 bg-white border border-slate-200 text-slate-700 font-medium py-3 rounded-xl hover:bg-slate-50 transition"
                                            >
                                                Cancel Entry
                                            </button>
                                            <button 
                                                onClick={confirmDuplicateSave}
                                                className="flex-1 bg-amber-100 text-amber-900 font-medium py-3 rounded-xl hover:bg-amber-200 transition"
                                            >
                                                Plant Anyway
                                            </button>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Manual Entry Modal */}
                    {isManualModalOpen && (
                        <div className="fixed inset-0 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4 z-50">
                            <div className="bg-white rounded-2xl w-full max-w-md shadow-xl overflow-hidden animate-in zoom-in-95">
                                <div className="flex justify-between items-center p-4 border-b bg-emerald-50">
                                    <h3 className="font-bold text-lg text-emerald-900">{editingPlant ? 'Edit Plant Details' : 'Manual Entry'}</h3>
                                    <button onClick={() => setIsManualModalOpen(false)} className="text-slate-400 hover:text-slate-600"><X className="w-5 h-5" /></button>
                                </div>
                                
                                <form 
                                    className="p-4 space-y-4"
                                    onSubmit={(e) => {
                                        e.preventDefault();
                                        const formData = new FormData(e.target);
                                        const r = parseInt(formData.get('row'), 10);
                                        const p = parseInt(formData.get('position'), 10);
                                        
                                        const varietyInput = formData.get('variety');
                                        const varietyToSave = editingPlant ? varietyInput : applySmartDictionary(varietyInput);

                                        handleAttemptSave({
                                            row: r,
                                            position: p,
                                            variety: varietyToSave,
                                            status: formData.get('status'),
                                            notes: formData.get('notes'),
                                            photo: editingPlant?.photo || null,
                                            id: editingPlant?.id || null
                                        }, !!editingPlant);
                                        
                                        if (!editingPlant && r === currentRow && p === currentPosition) {
                                            setCurrentPosition(currentPosition + 1);
                                        }
                                        setIsManualModalOpen(false);
                                    }}
                                >
                                    <div className="grid grid-cols-2 gap-4">
                                        <div className="space-y-1">
                                            <label className="text-sm font-medium text-slate-700">Row</label>
                                            <input type="number" name="row" required min="1" defaultValue={editingPlant?.row || currentRow} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none" />
                                        </div>
                                        <div className="space-y-1">
                                            <label className="text-sm font-medium text-slate-700">Position</label>
                                            <input type="number" name="position" required min="1" defaultValue={editingPlant?.position || currentPosition} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none" />
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700">Variety Name</label>
                                        <input type="text" name="variety" required defaultValue={editingPlant?.variety || ''} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none" placeholder="e.g. Cafe Au Lait" />
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700">Plant Status</label>
                                        <select name="status" defaultValue={editingPlant?.status || 'active'} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none bg-white">
                                            <option value="active">🌱 Healthy / Active</option>
                                            <option value="failed">❌ Did Not Grow (Failed)</option>
                                            <option value="skipped">🪨 Empty Space (Skipped)</option>
                                        </select>
                                    </div>

                                    <div className="space-y-1">
                                        <label className="text-sm font-medium text-slate-700 flex items-center justify-between">Additional Notes</label>
                                        <textarea name="notes" rows="2" defaultValue={editingPlant?.notes || ''} className="w-full border border-slate-200 rounded-lg p-2.5 focus:ring-2 focus:ring-amber-500 outline-none resize-none"></textarea>
                                    </div>
                                    
                                    <div className="pt-2 flex gap-3">
                                        <button type="button" onClick={() => setIsManualModalOpen(false)} className="flex-1 px-4 py-2 border border-slate-200 text-slate-700 rounded-xl hover:bg-slate-50 transition">Cancel</button>
                                        <button type="submit" className="flex-1 px-4 py-2 bg-emerald-700 text-white rounded-xl hover:bg-emerald-800 transition font-medium">Save Details</button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    )}

                    {viewingPhoto && (
                        <div className="fixed inset-0 bg-black/90 z-[60] flex items-center justify-center p-4 backdrop-blur-sm" onClick={() => setViewingPhoto(null)}>
                            <button onClick={() => setViewingPhoto(null)} className="absolute top-4 right-4 text-white bg-black/50 p-2 rounded-full hover:bg-white/20 transition">
                                <X className="w-6 h-6" />
                            </button>
                            <img src={viewingPhoto} alt="Dahlia" className="max-w-full max-h-[90vh] rounded-lg shadow-2xl object-contain animate-in zoom-in-95" onClick={(e) => e.stopPropagation()} />
                        </div>
                    )}
                </div>
            );
        }

        const root = createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
